name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop:
    name: Desktop (test + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Regras puras do importador e BuildInfo. Os smokes (librarySmoke, syncSmoke,
      # extract etc.) dependem de YouTube/Supabase/mpv e nao rodam no CI.
      - name: Build and test desktop
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process test compileKotlin

  android:
    name: Android (unit tests + debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Sem rede/Supabase/aparelho: testDebugUnitTest cobre Importer e
      # SpotifyClient.playlistId (AGP 9 só expõe unit tests do variant debug);
      # assembleDebug garante a compilacao do APK.
      - name: Build and test Android
        working-directory: androidApp
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
