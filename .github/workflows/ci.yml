name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop:
    name: Desktop (test + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Regras puras do importador e BuildInfo. Os smokes (librarySmoke, syncSmoke,
      # extract etc.) dependem de YouTube/Supabase/mpv e nao rodam no CI.
      - name: Build and test desktop
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process test compileKotlin

  android:
    name: Android (unit tests + debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O setup-android@v3 instala o pacote "tools" por padrao, que nao existe
      # mais no SDK atual. Mantemos a action so para licencas/PATH e instalamos
      # explicitamente a plataforma e o build-tools usados pelo projeto.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK 37
        shell: bash
        run: |
          # Prefere o cmdline-tools baixado pela action (16.0); o "latest"
          # preinstalado no runner e antigo (12.0).
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f ! -path '*/latest/*' | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Sem rede/Supabase/aparelho: testDebugUnitTest cobre Importer e
      # SpotifyClient.playlistId (AGP 9 só expõe unit tests do variant debug);
      # assembleDebug garante a compilacao do APK.
      - name: Build and test Android
        working-directory: androidApp
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
